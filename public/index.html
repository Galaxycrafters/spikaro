<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>spikaro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0e1419;
      --paper: #f3efe6;
      --accent: #0d9488;
      --muted: rgba(243, 239, 230, 0.72);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--paper);
      background:
        radial-gradient(900px 480px at 15% -10%, rgba(13, 148, 136, 0.22), transparent 55%),
        linear-gradient(165deg, var(--ink) 0%, #1a242c 100%);
    }
    main {
      width: min(560px, 100%);
      text-align: left;
    }
    .eyebrow {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.85rem;
    }
    .path {
      display: inline-block;
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .path code {
      color: #fff;
      background: rgba(243, 239, 230, 0.1);
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
    }
    .brief {
      background: rgba(243, 239, 230, 0.08);
      border: 1px solid rgba(243, 239, 230, 0.14);
      border-radius: 14px;
      padding: 1.15rem 1.25rem;
      line-height: 1.55;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .brief strong {
      display: block;
      color: #fff;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Galaxycrafters</p>
    <h1>spikaro</h1>
    <p class="path">Served at <code>/spikaro/</code></p>
    <div class="brief">
      <strong>Brief</strong>
      No brief yet — edit BRIEF.md or create an issue to start building.
    </div>
  </main>
</body>
</html>
